<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un nouveau post - CodeShare</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/main.min.css">
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-800 dark:text-dark-text min-h-screen flex flex-col">
<header class="bg-white dark:bg-gray-800 shadow-md p-4">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold italic">TEXTO</h1>
        <button id="themeToggle" data-theme-toggle class="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200">
            <i class="fas fa-sun text-2xl"></i>
        </button>
    </div>
</header>

<main class="flex-grow p-4">
    <div class="container mx-auto bg-white dark:bg-gray-800 shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-semibold mb-6">Créer un nouveau post</h2>
        <form class="flex flex-col justify-start">
            <div class="mb-4">
                <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Titre</label>
                <input type="text" id="title" name="title" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div class="mb-4">
                <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
                <textarea id="description" name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required></textarea>
            </div>
            <div class="mb-4">
                <label for="code" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Contenu</label>
                <textarea id="code" name="code" rows="10" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 font-mono" required></textarea>
            </div>
            <div class="mb-4 flex flex-col w-full gap-4">
                <div class="w-1/4">
                    <label for="expiration" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Expiration</label>
                    <input type="date" id="expiration" name="language" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </input>
                </div>
                <div class="flex flex-row w-1/4 items-center text-center justify-start gap-2">
                    <input id="unlimited" disabled type="checkbox">
                    <label for="unlimited">Sans limites <span class="rounded-full bg-red-400 text-slate-100 px-2 py-1 text-xs">PRO</span></label>
                </div>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                Publier
            </button>
        </form>
    </div>
</main>

<script src="./static/js/theme.js"></script>
</body>
</html>
